name: Daily Playwright System Run

on:
  schedule:
    # Runs every day at 2:00 AM Asia/Colombo time.
    # GitHub Actions schedules are in UTC, so 2:00 AM SLST = 8:30 PM UTC.
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  system-tests:
    name: Run full Playwright system tests
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TMDONE_EMAIL: ${{ secrets.TMDONE_EMAIL }}
      TMDONE_PASSWORD: ${{ secrets.TMDONE_PASSWORD }}
      TMDONE_BASE_URL: ${{ secrets.TMDONE_BASE_URL || 'https://consoledemo.uat.v3.dr.tmd1.org' }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full system test suite
        run: npm run test:all

      - name: Build email summary
        id: summary
        if: always()
        run: node .github/scripts/build-email-summary.js

      - name: Email daily test results
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.summary.outputs.subject }}
          to: lakmal@codezync.com,dulara@codezync.com,miyuru@codezync.com,nimsara@codezync.com
          from: TMDone Playwright CI <${{ secrets.GMAIL_ADDRESS }}>
          html_body: file://email-summary.html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
