<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Playwright automation flow diagram</title>
  <desc id="desc">A generic automation flow from code commit to Playwright report artifact.</desc>
  <rect width="1200" height="520" fill="#fbfcfe"/>
  <text x="70" y="70" fill="#111827" font-family="Arial, sans-serif" font-size="32" font-weight="700">Automation Journey</text>
  <text x="70" y="102" fill="#64748b" font-family="Arial, sans-serif" font-size="16">From commit to confidence, with privacy-safe reporting.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="180" height="130" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="105" y="220" fill="#1d4ed8" font-size="18" font-weight="700">Commit</text>
    <text x="105" y="250" fill="#334155" font-size="14">Source changes</text>
    <text x="105" y="272" fill="#334155" font-size="14">and test specs</text>
    <line x1="250" y1="235" x2="330" y2="235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="340" y="170" width="180" height="130" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="375" y="220" fill="#15803d" font-size="18" font-weight="700">CI Runner</text>
    <text x="375" y="250" fill="#334155" font-size="14">Install Node</text>
    <text x="375" y="272" fill="#334155" font-size="14">and browsers</text>
    <line x1="520" y1="235" x2="600" y2="235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="610" y="170" width="180" height="130" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="645" y="220" fill="#c2410c" font-size="18" font-weight="700">Playwright</text>
    <text x="645" y="250" fill="#334155" font-size="14">Run feature</text>
    <text x="645" y="272" fill="#334155" font-size="14">coverage</text>
    <line x1="790" y1="235" x2="870" y2="235" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="880" y="170" width="220" height="130" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="920" y="220" fill="#6d28d9" font-size="18" font-weight="700">Artifacts</text>
    <text x="920" y="250" fill="#334155" font-size="14">HTML report, trace,</text>
    <text x="920" y="272" fill="#334155" font-size="14">video on failure</text>
  </g>
  <rect x="70" y="365" width="1030" height="78" rx="18" fill="#111827"/>
  <text x="105" y="410" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Privacy gate:</text>
  <text x="235" y="410" fill="#d1d5db" font-family="Arial, sans-serif" font-size="17">generated evidence stays in local or CI artifacts unless sanitized and reviewed.</text>
</svg>
