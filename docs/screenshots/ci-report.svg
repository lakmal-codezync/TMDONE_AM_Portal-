<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized CI report mock screenshot</title>
  <desc id="desc">A generic GitHub Actions and Playwright report illustration with mock status values.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <rect x="45" y="40" width="1110" height="540" rx="22" fill="#ffffff" stroke="#dbe3ef"/>
  <rect x="45" y="40" width="1110" height="76" rx="22" fill="#0f172a"/>
  <text x="82" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">GitHub Actions - Playwright Tests</text>
  <text x="902" y="88" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="16" font-weight="700">Sanitized Preview</text>
  <g font-family="Arial, sans-serif">
    <rect x="85" y="150" width="300" height="118" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="115" y="196" fill="#15803d" font-size="18" font-weight="700">Workflow</text>
    <text x="115" y="230" fill="#0f172a" font-size="26" font-weight="700">Ready</text>
