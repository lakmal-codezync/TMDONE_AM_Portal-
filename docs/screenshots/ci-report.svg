    <circle cx="520" cy="400" r="9" fill="#22c55e"/>
    <text x="545" y="406" fill="#334155">Install Playwright browsers</text>
    <circle cx="520" cy="440" r="9" fill="#22c55e"/>
    <text x="545" y="446" fill="#334155">Run feature suites</text>
    <circle cx="865" cy="400" r="9" fill="#22c55e"/>
    <text x="890" y="406" fill="#334155">Upload report artifact</text>
  </g>
  <text x="115" y="550" fill="#64748b" font-family="Arial, sans-serif" font-size="14">No real run IDs, private URLs, users, or business records are shown.</text>
