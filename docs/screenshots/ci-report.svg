    <rect x="815" y="150" width="300" height="118" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="845" y="196" fill="#c2410c" font-size="18" font-weight="700">Artifacts</text>
    <text x="845" y="230" fill="#0f172a" font-size="26" font-weight="700">HTML Report</text>
  </g>
  <rect x="85" y="315" width="1030" height="195" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="115" y="356" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700">Pipeline Steps</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <circle cx="130" cy="400" r="9" fill="#22c55e"/>
